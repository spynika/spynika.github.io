<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>1337</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 50%, #1e1b4b 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Efek dinamis: grid berkedip samar */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 8s infinite alternate;
        }

        @keyframes gridPulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }

        /* Partikel dinamis (bisa jatuh) */
        .particle {
            position: fixed;
            bottom: 0;
            font-size: 1rem;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            animation: floatUp 8s linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Kartu utama */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 55px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.4);
        }

        /* Header */
        .glitch {
            font-size: 3.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: 3px;
            color: #0ff;
            text-shadow: 
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.05em -0.025em 0 rgba(0, 255, 0, 0.75),
                0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            animation: glitchShake 0.3s infinite alternate;
            margin-bottom: 0.5rem;
        }

        @keyframes glitchShake {
            0% { transform: translate(0); text-shadow: 0.05em 0 0 red, -0.05em -0.025em 0 lime, 0.025em 0.05em 0 blue; }
            100% { transform: translate(-0.02em, 0.01em); text-shadow: -0.05em 0.025em 0 red, 0.05em 0.05em 0 lime, -0.05em -0.05em 0 blue; }
        }

        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border-bottom: 1px dashed #334155;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }

        /* Daftar link */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin: 2rem 0;
        }

        /* Item link dengan efek dinamis */
        .link-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            transition: all 0.25s ease;
            border: 1px solid rgba(51, 65, 85, 0.6);
            overflow: hidden;
        }

        .link-item:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: #0ff;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
        }

        .link-icon {
            font-size: 2rem;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid #1e293b;
            min-width: 70px;
            text-align: center;
        }

        .link-item a {
            flex: 1;
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 0.8rem 1rem;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-item a span:first-child {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .arrow {
            font-size: 1.3rem;
            opacity: 0.6;
            transition: transform 0.2s, opacity 0.2s;
        }

        .link-item:hover .arrow {
            transform: translateX(5px);
            opacity: 1;
            color: #0ff;
        }

        /* Footer dinamis */
        .status {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #5b6e8c;
            border-top: 1px solid #1e293b;
            padding-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: #0f172a;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-family: monospace;
            font-size: 0.75rem;
            border: 1px solid #2d3a5e;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #0f0;
            box-shadow: 0 0 5px #0f0;
            animation: pulse 1.5s infinite;
            margin-right: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(0.8);}
        }

        /* Responsif */
        @media (max-width: 550px) {
            .card {
                padding: 1.5rem;
            }
            .glitch {
                font-size: 2.5rem;
            }
            .link-icon {
                font-size: 1.5rem;
                min-width: 55px;
                padding: 0.6rem 0.8rem;
            }
            .link-item a {
                font-size: 1rem;
                padding: 0.7rem 0.8rem;
            }
        }

        /* Animasi fade in */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeSlideUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="glitch">1337 NEVER DIE</div>
    <div style="text-align: center;">
        <div class="sub">// exploit making money //</div>
    </div>

    <div class="link-list">
        <!-- lc -->
        <div class="link-item">
            <div class="link-icon">📁</div>
            <a href="https://github.com/spynika/spynika.github.io/tree/main/lc" target="_blank" rel="noopener noreferrer">
                <span>📂 <strong>lc</strong> &nbsp; <span style="font-size:0.8rem; opacity:0.7;">localroot</span></span>
                <span class="arrow">➡️</span>
            </a>
        </div>

        <!-- sc -->
        <div class="link-item">
            <div class="link-icon">⚡</div>
            <a href="https://github.com/spynika/spynika.github.io/tree/main/sh" target="_blank" rel="noopener noreferrer">
                <span>🔧 <strong>sc</strong> &nbsp; <span style="font-size:0.8rem; opacity:0.7;">scanner</span></span>
                <span class="arrow">➡️</span>
            </a>
        </div>

        <!-- sh -->
        <div class="link-item">
            <div class="link-icon">🐚</div>
            <a href="https://github.com/spynika/spynika.github.io/tree/main/sh" target="_blank" rel="noopener noreferrer">
                <span>💻 <strong>sh</strong> &nbsp; <span style="font-size:0.8rem; opacity:0.7;">shellbackdoor</span></span>
                <span class="arrow">➡️</span>
            </a>
        </div>
    </div>

    <div class="status">
        <div class="badge">#hacktheplanet</div>
        <div class="badge">📱 haxorclan</div>
    </div>
</div>

<script>
    // Efek dinamis: partikel floating (akar 1337)
    function createParticle() {
        const particles = ['⚡', '🔓', '🖧', '⎇', '◉', '§', '1337', '>_', '#!', 'λ'];
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = particles[Math.floor(Math.random() * particles.length)];
        particle.style.left = Math.random() * 100 + '%';
        particle.style.fontSize = (Math.random() * 16 + 12) + 'px';
        particle.style.animationDuration = (Math.random() * 6 + 5) + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.opacity = Math.random() * 0.3 + 0.1;
        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 10000);
    }

    // Buat partikel secara berkala (dinamis)
    setInterval(createParticle, 1800);

    // Sedikit efek konsol dinamis (opsional)
    console.log("%c1337 NEVER DIE - Links loaded", "color: #0ff; font-size: 16px; font-family: monospace;");
    console.log("%c✓ lc | ✓ sc | ✓ sh", "color: #8a2be2; font-size: 12px;");
</script>

</body>
</html>
